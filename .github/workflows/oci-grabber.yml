name: OCI capacity grabber (secours + notification)

# La VM amd-vm-2 fait la chasse rapide (1 tentative / 25 s). Ce workflow :
#   1. NOTIFIE — ouvre une issue (= mail) pour toute VM ARM detectee, quelle
#      que soit la machine qui l'a creee, sans doublon.
#   2. SERT DE SECOURS — retente les cibles manquantes toutes les 30 min
#      seulement, pour ne pas concurrencer la VM (source de TooManyRequests).
#
# QUOTA REEL DE CE COMPTE (verifie par l'API) :
#   standard-a1-core-count = 2, standard-a1-memory-count = 12
# Soit 2 cœurs / 12 Go d'ARM au total — pas 4/24. Stockage : 200 Go, 94 pris.
#
# Rotation : on tente d'abord arm-vm-1 en 2/12 ; a defaut arm-vm-1 en 1/6 ;
# puis arm-vm-2 en 1/6 si la premiere est partie en petit format.
#
# ATTENTION MAINTENANCE : ne jamais ecrire de ligne commencant en colonne 0
# a l'interieur d'un bloc "run: |" (texte multi-ligne d'une issue, heredoc…).
# Cela termine le bloc YAML et rend le workflow invalide : GitHub cesse alors
# TOUTES les executions planifiees. Construire ces textes avec printf.
#
# A DESACTIVER quand le quota est plein (Actions > ... > Disable).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: oci-grabber
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CLI_USER:        ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY:     ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION:      ${{ secrets.OCI_CLI_REGION }}
      COMPARTMENT:         ${{ secrets.OCI_COMPARTMENT }}
      SUBNET:              ${{ secrets.OCI_SUBNET }}
      SSH_PUBKEY:          ${{ secrets.OCI_SSH_PUBKEY }}
      GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
      MAXCORES:            "2"
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Notifier les VM ARM existantes
        run: |
          set +e
          for NAME in arm-vm-1 arm-vm-2; do
            EX=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "length(data[?\"display-name\"=='$NAME' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
              --raw-output 2>/dev/null)
            [ "$EX" = "0" ] || [ -z "$EX" ] && continue

            FOUND=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
              --search "$NAME in:title" --json number --jq 'length' 2>/dev/null)
            if [ "$FOUND" != "0" ] && [ -n "$FOUND" ]; then
              echo "$NAME : deja notifiee"; continue
            fi

            ID=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "data[?\"display-name\"=='$NAME' && \"lifecycle-state\"!='TERMINATED'].id | [0]" --raw-output 2>/dev/null)
            IP=""
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              VN=$(oci compute instance list-vnics --instance-id "$ID" --query 'data[0].id' --raw-output 2>/dev/null)
              IP=$(oci network vnic get --vnic-id "$VN" --query 'data."public-ip"' --raw-output 2>/dev/null)
            fi
            CORES=$(oci compute instance get --instance-id "$ID" --query 'data."shape-config".ocpus' --raw-output 2>/dev/null)
            MEM=$(oci compute instance get --instance-id "$ID" --query 'data."shape-config"."memory-in-gbs"' --raw-output 2>/dev/null)

            # Corps construit avec printf : aucune ligne en colonne 0 dans le YAML.
            BODY=$(printf 'Nouvelle machine **ARM** obtenue : **%s**\n\nConfiguration : %s cœur(s) / %s Go\nIP publique : `%s`\n\nConnexion :\n```\nssh -i ~/.ssh/main-vm ubuntu@%s\n```\n\nQuota ARM de ce compte : 2 cœurs / 12 Go. Quand il est plein, le service sur amd-vm-2 sarrete seul ; pense a desactiver ce workflow.\n' "$NAME" "${CORES:-?}" "${MEM:-?}" "${IP:-a recuperer dans la console OCI}" "${IP:-IP_PUBLIQUE}")

            echo "$NAME : nouvelle -> notification"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "🎉 $NAME obtenue (VM ARM)" --body "$BODY"
          done

      - name: Filet de secours - tenter les cibles manquantes
        run: |
          set +e
          AD=$(oci iam availability-domain list --query "data[0].name" --raw-output)

          CNT=$(oci compute instance list -c "$COMPARTMENT" --all \
            --query "length(data[?\"shape\"=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
            --raw-output 2>/dev/null)
          if [ "$CNT" = "0" ]; then
            USED=0
          else
            USED=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "sum(data[?\"shape\"=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'].\"shape-config\".ocpus)" \
              --raw-output 2>/dev/null)
          fi
          case "$USED" in ''|*[!0-9.]*) USED=$MAXCORES ;; esac
          BUDGET=$(awk -v u="$USED" -v m="$MAXCORES" 'BEGIN{printf "%d", m-u}')
          [ "$BUDGET" -lt 0 ] && BUDGET=0
          echo "ARM : $USED/$MAXCORES cœurs utilises -> budget $BUDGET"
          [ "$BUDGET" -le 0 ] && { echo "Quota ARM plein — pensez a desactiver ce workflow."; exit 0; }

          IMG=$(oci compute image list -c "$COMPARTMENT" \
            --operating-system "Canonical Ubuntu" --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED \
            --query 'data[0].id' --raw-output 2>/dev/null)

          existe() {
            local n=$1 e
            e=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "length(data[?\"display-name\"=='$n' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
              --raw-output 2>/dev/null)
            [ "$e" != "0" ]
          }

          tenter() {
            local NAME=$1 OCPU=$2 MEM=$3 OUT R
            echo "Tentative $NAME ($OCPU cœur(s) / $MEM Go)…"
            OUT=$(oci compute instance launch \
              --availability-domain "$AD" --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.A1.Flex" --shape-config "{\"ocpus\": $OCPU, \"memoryInGBs\": $MEM}" \
              --image-id "$IMG" --subnet-id "$SUBNET" --assign-public-ip true \
              --display-name "$NAME" \
              --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBKEY\"}" 2>&1)
            if echo "$OUT" | grep -q '"id"'; then
              echo "✅ $NAME creee — notification au prochain passage"
              return 0
            fi
            R=$(echo "$OUT" | grep -oiE 'out of host capacity|toomanyrequests|limitexceeded' | head -1)
            echo "$NAME -> ${R:-echec}"
            return 1
          }

          if ! existe arm-vm-1; then
            if [ "$BUDGET" -ge 2 ]; then
              tenter arm-vm-1 2 12 && exit 0
              sleep 45
            fi
            tenter arm-vm-1 1 6 && exit 0
          elif ! existe arm-vm-2 && [ "$BUDGET" -ge 1 ]; then
            tenter arm-vm-2 1 6
          else
            echo "Rien a tenter."
          fi
