name: OCI capacity grabber (secours + notification)

# Depuis que la VM amd-vm-2 chasse en continu (1 tentative / 25 s), ce workflow
# change de role. Il devient :
#
#   1. LE NOTIFICATEUR — c'est lui qui t'envoie un mail. Il detecte toute VM ARM
#      presente, quelle que soit la machine qui l'a creee, et ouvre une issue
#      (une seule par VM, il verifie qu'elle n'existe pas deja).
#
#   2. UN FILET DE SECOURS — il retente les cibles manquantes, mais seulement
#      toutes les 30 min, pour ne pas entrer en concurrence avec la VM et
#      declencher des TooManyRequests cote Oracle.
#
# Cibles ARM (somme = 4 OCPU / 24 Go = maximum gratuit) :
#   arm-vm-1 = 1/6, arm-vm-2 = 1/6, arm-vm-3 = 2/12
#
# Anti-facturation : budget = 4 - OCPU deja utilises, decremente a chaque
# creation reussie dans le run. Une cible existante n'est jamais recreee.
#
# A DESACTIVER quand le quota est plein (Actions > ... > Disable).

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: oci-grabber
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CLI_USER:        ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY:     ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION:      ${{ secrets.OCI_CLI_REGION }}
      COMPARTMENT:         ${{ secrets.OCI_COMPARTMENT }}
      SUBNET:              ${{ secrets.OCI_SUBNET }}
      SSH_PUBKEY:          ${{ secrets.OCI_SSH_PUBKEY }}
      GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Notifier les VM ARM existantes
        run: |
          set +e
          for NAME in arm-vm-1 arm-vm-2 arm-vm-3; do
            EX=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "length(data[?\"display-name\"=='$NAME' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
              --raw-output 2>/dev/null)
            [ "$EX" = "0" ] || [ -z "$EX" ] && continue

            # Une issue existe-t-elle deja pour cette VM ?
            FOUND=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
              --search "$NAME in:title" --json number --jq 'length' 2>/dev/null)
            if [ "$FOUND" != "0" ] && [ -n "$FOUND" ]; then
              echo "$NAME : deja notifiee"
              continue
            fi

            IP=""
            ID=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "data[?\"display-name\"=='$NAME' && \"lifecycle-state\"!='TERMINATED'].id | [0]" --raw-output 2>/dev/null)
            if [ -n "$ID" ] && [ "$ID" != "null" ]; then
              VN=$(oci compute instance list-vnics --instance-id "$ID" --query 'data[0].id' --raw-output 2>/dev/null)
              IP=$(oci network vnic get --vnic-id "$VN" --query 'data."public-ip"' --raw-output 2>/dev/null)
            fi

            echo "$NAME : nouvelle -> notification"
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "🎉 $NAME obtenue (VM ARM)" \
              --body "Une machine **ARM** vient d'etre obtenue : **$NAME**.

IP publique : \`${IP:-a recuperer dans la console OCI}\`

Connexion : \`ssh -i ~/.ssh/main-vm ubuntu@${IP:-IP_PUBLIQUE}\` (depuis le Cloud Shell OCI).

Quand tout ton quota ARM est pris (4 OCPU / 24 Go), pense a desactiver ce workflow et le service sur amd-vm-2 :
\`sudo systemctl disable --now oci-grabber\`"
          done

      - name: Filet de secours - tenter les cibles manquantes
        run: |
          set +e
          AD=$(oci iam availability-domain list --query "data[0].name" --raw-output)

          CNT=$(oci compute instance list -c "$COMPARTMENT" --all \
            --query "length(data[?\"shape\"=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
            --raw-output 2>/dev/null)
          if [ "$CNT" = "0" ]; then
            USED=0
          else
            USED=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "sum(data[?\"shape\"=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'].\"shape-config\".ocpus)" \
              --raw-output 2>/dev/null)
          fi
          case "$USED" in ''|*[!0-9.]*) USED=4 ;; esac
          BUDGET=$(awk -v u="$USED" 'BEGIN{printf "%d", 4-u}')
          [ "$BUDGET" -lt 0 ] && BUDGET=0
          echo "ARM : $USED/4 OCPU utilises -> budget $BUDGET"
          [ "$BUDGET" -le 0 ] && { echo "Quota ARM plein — pensez a desactiver ce workflow."; exit 0; }

          IMG=$(oci compute image list -c "$COMPARTMENT" \
            --operating-system "Canonical Ubuntu" --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED \
            --query 'data[0].id' --raw-output 2>/dev/null)

          for T in "arm-vm-1 1 6" "arm-vm-2 1 6" "arm-vm-3 2 12"; do
            set -- $T
            NAME=$1; OCPU=$2; MEM=$3

            EX=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "length(data[?\"display-name\"=='$NAME' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
              --raw-output 2>/dev/null)
            [ "$EX" != "0" ] && continue
            [ "$OCPU" -gt "$BUDGET" ] && continue

            OUT=$(oci compute instance launch \
              --availability-domain "$AD" --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.A1.Flex" --shape-config "{\"ocpus\": $OCPU, \"memoryInGBs\": $MEM}" \
              --image-id "$IMG" --subnet-id "$SUBNET" --assign-public-ip true \
              --display-name "$NAME" \
              --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBKEY\"}" 2>&1)

            if echo "$OUT" | grep -q '"id"'; then
              BUDGET=$((BUDGET - OCPU))
              echo "✅ $NAME creee — notification au prochain passage"
            else
              R=$(echo "$OUT" | grep -oiE 'out of host capacity|toomanyrequests|limitexceeded' | head -1)
              echo "$NAME -> ${R:-echec}"
              echo "$R" | grep -qi toomanyrequests && break
            fi
            sleep 45
          done
