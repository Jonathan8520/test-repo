name: OCI capacity grabber

# A chaque run (~toutes les 11 min), COMPLETE le quota Always Free en tentant
# TOUTES les cibles manquantes, espacees pour ne pas se faire brider :
#   - 2e VM AMD  : E2.1.Micro, 1 OCPU / 1 Go              -> "amd-vm-2"
#   - VM ARM (liste-cible FIXE, somme = 4 OCPU / 24 Go) :
#         arm-vm-1 = 1 OCPU / 6 Go
#         arm-vm-2 = 1 OCPU / 6 Go
#         arm-vm-3 = 2 OCPU / 12 Go
#
# POURQUOI TOUT TENTER : la capacite dispo depend de la TAILLE demandee. Un trou
# de 1 OCPU peut exister quand un trou de 2 OCPU n'existe pas. Tenter les trois
# formats = trois chances independantes au lieu d'une.
#
# ANTI-BRIDAGE : 45 s entre chaque tentative, et arret immediat du run si Oracle
# renvoie TooManyRequests (inutile d'insister, ca aggrave le bridage).
#
# SECURITE ANTI-FACTURATION (triple garde-fou) :
#   1) une cible n'est tentee que si aucune instance de ce nom n'existe
#      (comptage devant valoir EXACTEMENT 0 ; en cas de doute -> on saute) ;
#   2) budget d'OCPU ARM calcule au debut du run (4 - deja utilises) ;
#   3) ce budget est DECREMENTE a chaque creation reussie dans le run meme,
#      donc impossible de depasser 4 OCPU meme si les 3 cibles passent d'un coup.
#
# Ne fait QUE creer ; ne touche jamais aux instances existantes.
# Ouvre une issue (= mail) a chaque creation. A DESACTIVER quand le quota est plein.

on:
  schedule:
    - cron: '*/11 * * * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: oci-grabber
  cancel-in-progress: false

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_CLI_USER:        ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY:     ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION:      ${{ secrets.OCI_CLI_REGION }}
      COMPARTMENT:         ${{ secrets.OCI_COMPARTMENT }}
      SUBNET:              ${{ secrets.OCI_SUBNET }}
      SSH_PUBKEY:          ${{ secrets.OCI_SSH_PUBKEY }}
      GH_TOKEN:            ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Tenter toutes les cibles manquantes (espacees)
        run: |
          set +e
          AD=$(oci iam availability-domain list --query "data[0].name" --raw-output)
          echo "AD : $AD"

          notify() {
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "✅ $1 creee sur OCI" \
              --body "Le grabber a cree **$1**. Recupere son IP publique dans la console OCI > Compute > Instances, puis connecte-toi : ssh -i ~/.ssh/main-vm ubuntu@IP_PUBLIQUE. Desactive ce workflow quand ton quota est plein."
          }

          # Compte les instances portant un nom donne (0 = absente, sinon on saute).
          count_named() {
            oci compute instance list -c "$COMPARTMENT" --all \
              --query "length(data[?\"display-name\"=='$1' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
              --raw-output 2>/dev/null
          }

          # ===== 2e VM AMD =====
          AMD_N=$(oci compute instance list -c "$COMPARTMENT" --all \
            --query "length(data[?\"shape\"=='VM.Standard.E2.1.Micro' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
            --raw-output 2>/dev/null)
          case "$AMD_N" in ''|*[!0-9]*) AMD_N=2 ;; esac
          echo "AMD : $AMD_N/2"

          RATE_LIMITED=0

          if [ "$AMD_N" -lt 2 ]; then
            IMG=$(oci compute image list -c "$COMPARTMENT" \
              --operating-system "Canonical Ubuntu" --operating-system-version "22.04" \
              --shape "VM.Standard.E2.1.Micro" --sort-by TIMECREATED \
              --query "data[0].id" --raw-output)
            echo "Tentative amd-vm-2 (1 OCPU / 1 Go)…"
            OUT=$(oci compute instance launch \
              --availability-domain "$AD" --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.E2.1.Micro" \
              --image-id "$IMG" --subnet-id "$SUBNET" --assign-public-ip true \
              --display-name "amd-vm-2" \
              --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBKEY\"}" 2>&1)
            if echo "$OUT" | grep -q '"id"'; then
              echo "✅ amd-vm-2 creee"; notify "amd-vm-2"
            else
              REASON=$(echo "$OUT" | grep -oiE 'out of host capacity|toomanyrequests|limitexceeded' | head -1)
              echo "amd-vm-2 -> ${REASON:-echec}"
              echo "$REASON" | grep -qi toomanyrequests && RATE_LIMITED=1
            fi
            sleep 45
          fi

          # ===== ARM : budget d'OCPU disponible =====
          ARM_COUNT=$(oci compute instance list -c "$COMPARTMENT" --all \
            --query "length(data[?\"shape\"=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'])" \
            --raw-output 2>/dev/null)
          if [ "$ARM_COUNT" = "0" ]; then
            USED=0
          else
            USED=$(oci compute instance list -c "$COMPARTMENT" --all \
              --query "sum(data[?\"shape\"=='VM.Standard.A1.Flex' && \"lifecycle-state\"!='TERMINATED' && \"lifecycle-state\"!='TERMINATING'].\"shape-config\".ocpus)" \
              --raw-output 2>/dev/null)
          fi
          case "$USED" in ''|*[!0-9.]*) USED=4 ;; esac
          BUDGET=$(awk -v u="$USED" 'BEGIN{printf "%d", 4-u}')
          [ "$BUDGET" -lt 0 ] && BUDGET=0
          echo "ARM : $USED/4 OCPU utilises -> budget restant $BUDGET OCPU"

          IMG_ARM=$(oci compute image list -c "$COMPARTMENT" \
            --operating-system "Canonical Ubuntu" --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" --sort-by TIMECREATED \
            --query "data[0].id" --raw-output)

          # On tente CHAQUE cible manquante, en decrementant le budget au fur et a mesure.
          for TARGET in "arm-vm-1 1 6" "arm-vm-2 1 6" "arm-vm-3 2 12"; do
            set -- $TARGET
            NAME=$1; OCPU=$2; MEM=$3

            if [ "$RATE_LIMITED" = "1" ]; then
              echo "Bride par Oracle -> on arrete ce run, le prochain reessaiera."
              break
            fi

            EX=$(count_named "$NAME")
            if [ "$EX" != "0" ]; then
              echo "$NAME : existe deja (ou comptage incertain) -> saut"
              continue
            fi

            if [ "$OCPU" -gt "$BUDGET" ]; then
              echo "$NAME : budget insuffisant ($OCPU > $BUDGET OCPU) -> saut"
              continue
            fi

            echo "Tentative $NAME ($OCPU OCPU / $MEM Go)…"
            OUT=$(oci compute instance launch \
              --availability-domain "$AD" --compartment-id "$COMPARTMENT" \
              --shape "VM.Standard.A1.Flex" --shape-config "{\"ocpus\": $OCPU, \"memoryInGBs\": $MEM}" \
              --image-id "$IMG_ARM" --subnet-id "$SUBNET" --assign-public-ip true \
              --display-name "$NAME" \
              --metadata "{\"ssh_authorized_keys\": \"$SSH_PUBKEY\"}" 2>&1)

            if echo "$OUT" | grep -q '"id"'; then
              BUDGET=$((BUDGET - OCPU))
              echo "✅ $NAME creee ($OCPU OCPU / $MEM Go) — budget restant : $BUDGET OCPU"
              notify "$NAME"
            else
              REASON=$(echo "$OUT" | grep -oiE 'out of host capacity|toomanyrequests|limitexceeded' | head -1)
              echo "$NAME -> ${REASON:-echec}"
              echo "$REASON" | grep -qi toomanyrequests && RATE_LIMITED=1
            fi
            sleep 45
          done

          echo "Fin du run."
