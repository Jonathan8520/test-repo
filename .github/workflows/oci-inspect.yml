name: OCI inspect (etat + contenu VM)

# 1) Liste les instances du compartiment.
# 2) Active le plugin "Compute Instance Run Command" sur l'instance (API).
# 3) Execute une commande LECTURE SEULE dans la VM via l'agent Oracle (sans SSH).
#
# La commande est de l'inspection pure : uname, RAM, disque, uptime, services,
# contenu de /home. Elle n'installe et ne modifie RIEN sur la VM.
# L'activation du plugin ne redemarre pas l'instance.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "OCID de l'instance a inspecter"
        required: true
        default: "ocid1.instance.oc1.eu-paris-1.anrwiljr4qgaapycfz6bk4rz5cpg7of7rlju6uzghyf2s3akxewp35pkmnqq"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OCI_CLI_USER:        ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY:     ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION:      ${{ secrets.OCI_CLI_REGION }}
      COMPARTMENT:         ${{ secrets.OCI_COMPARTMENT }}
      INSTANCE_ID:         ${{ github.event.inputs.instance_id }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Inventaire des instances
        run: |
          set +e
          echo "=== INVENTAIRE ==="
          oci compute instance list -c "$COMPARTMENT" --all \
            --query 'data[?"lifecycle-state"!=`TERMINATED`].{name:"display-name", shape:"shape", state:"lifecycle-state", ocpus:"shape-config".ocpus, memGB:"shape-config"."memory-in-gbs"}' \
            --output table

      - name: Activer le plugin Run Command
        run: |
          set +e
          AGENT=$(jq -nc '{areAllPluginsDisabled:false, isManagementDisabled:false, isMonitoringDisabled:false, pluginsConfig:[{name:"Compute Instance Run Command", desiredState:"ENABLED"}]}')
          echo "Activation du plugin…"
          oci compute instance update --instance-id "$INSTANCE_ID" \
            --agent-config "$AGENT" --force \
            --query 'data."agent-config"' --output json 2>&1 | head -30
          echo "Attente de la prise en compte par l'agent (90 s)…"
          sleep 90

      - name: Run Command - inspection lecture seule
        run: |
          set +e
          SCRIPT='echo "== OS ==" ; uname -a ; echo ; echo "== Uptime ==" ; uptime ; echo ; echo "== RAM ==" ; free -h ; echo ; echo "== Disque ==" ; df -h / ; echo ; echo "== /home ==" ; ls -la /home/ubuntu 2>/dev/null || ls -la /home ; echo ; echo "== Services actifs ==" ; systemctl list-units --type=service --state=running --no-pager --no-legend | head -25'

          CONTENT=$(jq -nc --arg t "$SCRIPT" '{source:{sourceType:"TEXT",text:$t},output:{outputType:"TEXT"}}')
          TARGET=$(jq -nc --arg i "$INSTANCE_ID" '{instanceId:$i}')

          echo "Envoi de la commande a l'agent…"
          OUT=$(oci instance-agent command create \
            --compartment-id "$COMPARTMENT" \
            --timeout-in-seconds 120 \
            --target "$TARGET" \
            --content "$CONTENT" 2>&1)

          CMD_ID=$(echo "$OUT" | grep -o '"id": *"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$CMD_ID" ]; then
            echo "❌ Creation impossible :"
            echo "$OUT" | head -40
            exit 0
          fi
          echo "Command ID : $CMD_ID"

          for i in $(seq 1 16); do
            RES=$(oci instance-agent command-execution get \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --output json 2>&1)
            STATE=$(echo "$RES" | grep -oiE '"(lifecycle-state|delivery-state)": *"[A-Za-z_]*"' | head -1 | cut -d'"' -f4)
            echo "[$i] etat : ${STATE:-inconnu}"
            case "$STATE" in
              SUCCEEDED|FAILED|TIMED_OUT|CANCELED)
                echo "=== RESULTAT ==="
                echo "$RES"
                exit 0 ;;
            esac
            sleep 15
          done
          echo "Toujours VISIBLE : l'agent invite ne consomme pas la commande."
          echo "=> Le plugin Run Command n'est pas operationnel dans la VM."
