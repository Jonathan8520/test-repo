name: OCI inspect (etat + contenu VM)

# 1) Liste toutes les instances du compartiment (nom, shape, etat, ocpus).
# 2) Execute une commande LECTURE SEULE dans amd-vm via "Run Command" de
#    l'agent Oracle (aucun SSH necessaire) et affiche le resultat.
#
# La commande executee est de l'inspection pure : uname, RAM, disque, uptime,
# services actifs, contenu de /home. Elle n'installe et ne modifie RIEN.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "OCID de l'instance a inspecter"
        required: true
        default: "ocid1.instance.oc1.eu-paris-1.anrwiljr4qgaapycfz6bk4rz5cpg7of7rlju6uzghyf2s3akxewp35pkmnqq"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OCI_CLI_USER:        ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY:     ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION:      ${{ secrets.OCI_CLI_REGION }}
      COMPARTMENT:         ${{ secrets.OCI_COMPARTMENT }}
      INSTANCE_ID:         ${{ github.event.inputs.instance_id }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Inventaire des instances
        run: |
          set +e
          oci compute instance list -c "$COMPARTMENT" --all \
            --query 'data[?"lifecycle-state"!=`TERMINATED`].{name:"display-name", shape:"shape", state:"lifecycle-state", ocpus:"shape-config".ocpus, memGB:"shape-config"."memory-in-gbs"}' \
            --output table

      - name: Run Command - inspection lecture seule
        run: |
          set +e
          SCRIPT='echo "== OS ==" ; uname -a ; echo ; echo "== Uptime ==" ; uptime ; echo ; echo "== RAM ==" ; free -h ; echo ; echo "== Disque ==" ; df -h / ; echo ; echo "== /home ==" ; ls -la /home/ubuntu 2>/dev/null || ls -la /home ; echo ; echo "== Services actifs ==" ; systemctl list-units --type=service --state=running --no-pager --no-legend | head -25 ; echo ; echo "== Ecoute reseau ==" ; (ss -tulnp 2>/dev/null || netstat -tulnp 2>/dev/null) | head -20'

          CONTENT=$(python3 - "$SCRIPT" <<'PY'
import json,sys
print(json.dumps({
  "source": {"sourceType": "TEXT", "text": sys.argv[1]},
  "output": {"outputType": "TEXT"}
}))
PY
)
          TARGET=$(python3 - "$INSTANCE_ID" <<'PY'
import json,sys
print(json.dumps({"instanceId": sys.argv[1]}))
PY
)

          echo "Envoi de la commande a l'agent…"
          OUT=$(oci instance-agent command create \
            --compartment-id "$COMPARTMENT" \
            --execution-time-out-in-seconds 120 \
            --target "$TARGET" \
            --content "$CONTENT" 2>&1)

          CMD_ID=$(echo "$OUT" | grep -o '"id": *"[^"]*"' | head -1 | cut -d'"' -f4)
          if [ -z "$CMD_ID" ]; then
            echo "❌ Impossible de creer la commande. Reponse d'Oracle :"
            echo "$OUT" | head -30
            echo
            echo "Si le message parle du plugin/agent : activer 'Compute Instance Run Command'"
            echo "dans la console OCI (Instance > Oracle Cloud Agent), puis relancer."
            exit 0
          fi
          echo "Command ID : $CMD_ID"

          for i in $(seq 1 20); do
            RES=$(oci instance-agent command-execution get \
              --instance-agent-command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --output json 2>&1)
            STATE=$(echo "$RES" | grep -o '"lifecycle-state": *"[A-Z_]*"' | head -1 | cut -d'"' -f4)
            echo "[$i] etat : ${STATE:-inconnu}"
            case "$STATE" in
              SUCCEEDED|FAILED|TIMED_OUT|CANCELED)
                echo "=== RESULTAT ==="
                echo "$RES"
                exit 0 ;;
            esac
            sleep 15
          done
          echo "Toujours en cours apres 5 min — reessayer plus tard."
