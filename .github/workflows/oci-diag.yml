name: OCI VM diag (agent / Run Command)

# Diagnostic LECTURE SEULE : verifie si l'agent Oracle Cloud et son plugin
# "Compute Instance Run Command" sont actives sur l'instance. C'est ce qui
# determine si on peut executer des commandes DANS la VM depuis un workflow
# (donc installer le grabber ARM sur la VM sans SSH).
#
# Ne modifie RIEN. Workflow temporaire, supprimable une fois la reponse connue.

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "OCID de l'instance a diagnostiquer"
        required: true
        default: "ocid1.instance.oc1.eu-paris-1.anrwiljr4qgaapycfz6bk4rz5cpg7of7rlju6uzghyf2s3akxewp35pkmnqq"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      OCI_CLI_USER:        ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY:     ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION:      ${{ secrets.OCI_CLI_REGION }}
      INSTANCE_ID:         ${{ github.event.inputs.instance_id }}
    steps:
      - name: Install OCI CLI
        run: pip install --quiet oci-cli

      - name: Etat de l'instance
        run: |
          oci compute instance get --instance-id "$INSTANCE_ID" \
            --query 'data.{name:"display-name", state:"lifecycle-state", shape:"shape"}' \
            --output table

      - name: Config de l'agent (plugins)
        run: |
          echo "=== agent-config ==="
          oci compute instance get --instance-id "$INSTANCE_ID" \
            --query 'data."agent-config"' --output json

      - name: Verdict Run Command
        run: |
          set +e
          CFG=$(oci compute instance get --instance-id "$INSTANCE_ID" \
            --query 'data."agent-config"' --output json 2>/dev/null)
          MGMT=$(echo "$CFG" | grep -o '"is-management-disabled": *[a-z]*' | head -1)
          echo "$MGMT"
          if echo "$CFG" | grep -A2 -i 'run command' | grep -qi '"desired-state": *"ENABLED"'; then
            echo "OK : le plugin Run Command est ENABLED -> on peut executer des commandes dans la VM depuis un workflow."
          else
            echo "Plugin Run Command non confirme comme ENABLED (voir le JSON ci-dessus)."
            echo "Il peut etre active dans la console OCI : Instance > Oracle Cloud Agent > Compute Instance Run Command."
          fi
